<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="https://t-nba.github.io/favicon.png">
<meta property="og:site_name" content="T-NBA Championship">
<meta property="og:title" content="T-NBA Championship — Sezon Arşivi">
<meta property="og:description" content="Haftalık sonuçlar, puan durumu, en'ler ve tüm haftaların kayıtları.">
<meta property="og:image" content="https://t-nba.github.io/og-kart.png">
<meta property="og:type" content="website">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/modernist-785da292-216d-47a9-800f-8e6c4680f25f/styles.css">
<script src="_ds/modernist-785da292-216d-47a9-800f-8e6c4680f25f/_ds_bundle.js"></script>
<style>
@media (max-width: 760px){
  .kok{ padding:22px 14px 60px !important }
  .ana{ grid-template-columns:1fr !important; gap:20px !important; padding-top:18px !important }
  .ana > *{ min-width:0 }
  .haftalar{ min-width:0; max-width:100% }
  .hafta-serit{ flex-wrap:nowrap !important; min-width:0; max-width:100%; overflow-x:auto !important; padding:1px 1px 6px; scrollbar-width:none; -webkit-overflow-scrolling:touch }
  .hafta-serit::-webkit-scrollbar{ display:none }
  .hafta-cip{ width:40px !important; height:40px !important; font-size:15px !important }
  .haftalar::after{ content:""; position:absolute; right:0; bottom:0; width:32px; height:52px; background:linear-gradient(90deg, rgba(243,242,242,0), var(--color-bg,#f3f2f2)); pointer-events:none }
  .sekmeler{ flex-wrap:nowrap !important; min-width:0; max-width:100%; overflow-x:auto !important; gap:8px !important; padding:2px 2px 8px; scrollbar-width:none; -webkit-overflow-scrolling:touch }
  .sekmeler::-webkit-scrollbar{ display:none }
  .sekmeler > div{ flex:0 0 auto; padding:10px 14px !important; font-size:13px !important }
  .st{ grid-template-columns:32px 38px 1fr 86px !important }
  .ustbar{ flex-wrap:wrap !important; gap:12px !important }
  .ustbar img{ width:42px !important; height:42px !important }
  .ustbar > div:nth-of-type(1){ font-size:15px !important; letter-spacing:0.06em !important }
  .ustbar > div:last-child{ margin-left:0 !important; font-size:11px !important; padding:6px 10px !important }
  .formh{ display:none !important }
  .mac{ grid-template-columns:1fr 78px 1fr !important }
  .mac > div{ font-size:16px !important }
  .lid{ grid-template-columns:52px 1fr auto !important; column-gap:8px }
  .lid > div{ font-size:17px !important; min-width:0 }
  .lid > div:nth-child(1){ font-size:14px !important }
  .lid > div:nth-child(2){ font-size:19px !important }
  .lid > div:last-child{ font-size:13px !important; max-width:160px; overflow:hidden; text-overflow:ellipsis }
}
</style>
<script src="image-slot.js"></script>
<style>body{margin:0;background:var(--color-bg,#f3f2f2)} a{color:var(--color-accent,#ec3013);text-decoration:none} a:hover{color:var(--color-accent-700,#a02613)}</style>
</helmet>
<div data-screen-label="Arsiv" class="kok" style="min-height:100vh;box-sizing:border-box;color:var(--color-text,#201e1d);font-family:var(--font-body,'Archivo',sans-serif);max-width:1240px;margin:0 auto;padding:44px 48px 80px">
  <div class="ustbar" style="display:flex;align-items:center;gap:20px;padding-bottom:20px;border-bottom:2px solid var(--color-text,#201e1d)">
    <img src="assets/tnba-logo-pro.png" alt="T-NBA" style="width:56px;height:56px;border-radius:50%;box-shadow:0 0 0 2px var(--color-text,#201e1d)"></img>
    <div style="font-size:23px;font-weight:900;letter-spacing:0.1em">T-NBA CHAMPIONSHIP — SEZON ARŞİVİ</div>
    <div style="margin-left:auto;background:var(--color-accent,#ec3013);color:#fff;font-size:13px;font-weight:800;letter-spacing:0.18em;padding:8px 14px;white-space:nowrap">2026-27 SEZONU</div>
  </div>
  <div class="ana" style="display:grid;grid-template-columns:220px 1fr;gap:40px;padding-top:32px;align-items:start">
    <div class="haftalar" style="display:flex;flex-direction:column;position:relative">
      <div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px">
        <div style="font-size:13px;font-weight:800;letter-spacing:0.24em;color:rgba(32,30,29,0.5)">HAFTALAR</div>
        <div style="font-size:12px;font-weight:900;letter-spacing:0.08em;color:var(--color-accent,#ec3013);white-space:nowrap">{{ selLabel }}</div>
      </div>
      <div class="hafta-serit" style="display:flex;flex-wrap:wrap;gap:8px">
      <sc-for list="{{ weeks }}" as="w" hint-placeholder-count="1">
        <div onClick="{{ w.pick }}" class="hafta-cip" style="cursor:pointer;flex:0 0 auto;width:42px;height:42px;display:grid;place-items:center;box-sizing:border-box;border:1px solid rgba(32,30,29,0.35);font-size:16px;font-weight:900;font-variant-numeric:tabular-nums;background:{{ w.bg }};color:{{ w.fg }}" style-hover="border-color:#201e1d">{{ w.num }}</div>
      </sc-for>
      </div>
    </div>
    <div style="min-width:0">
      <div class="sekmeler" style="display:flex;gap:10px;margin-bottom:26px">
        <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3">
          <div onClick="{{ t.pick }}" style="cursor:pointer;padding:12px 22px;border:1px solid rgba(32,30,29,0.35);font-size:15px;font-weight:800;letter-spacing:0.14em;background:{{ t.bg }};color:{{ t.fg }}" style-hover="border-color:#201e1d">{{ t.label }}</div>
        </sc-for>
      </div>
      <sc-if value="{{ isStand }}" hint-placeholder-val="{{ true }}">
        <div>
          <div class="st" style="display:grid;grid-template-columns:64px 48px 1fr 130px 190px;align-items:center;border-top:2px solid var(--color-text,#201e1d);border-bottom:2px solid var(--color-text,#201e1d);padding:10px 0;font-size:13px;font-weight:800;letter-spacing:0.2em;color:rgba(32,30,29,0.55)">
            <div>#</div><div></div><div>TAKIM</div><div style="text-align:right">W-L-T</div><div class="formh" style="text-align:right">FORM</div>
          </div>
          <sc-for list="{{ rows }}" as="row" hint-placeholder-count="18">
            <div class="st" style="display:grid;grid-template-columns:64px 48px 1fr 130px 190px;align-items:center;height:56px;border-bottom:1px solid rgba(32,30,29,0.14)">
              <div style="font-size:22px;font-weight:900;color:rgba(32,30,29,0.55)">{{ row.r }}</div>
              <img src="{{ row.logo }}" alt="" style="flex-shrink:0;width:47px;height:47px;object-fit:contain;display:block"></img>
              <div style="font-size:19px;font-weight:700;padding-left:14px;white-space:nowrap;overflow:hidden">{{ row.n }}</div>
              <div style="text-align:right;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums">{{ row.rec }}</div>
              <div class="formh" style="display:flex;gap:6px;justify-content:flex-end">
                <sc-for list="{{ row.form }}" as="f" hint-placeholder-count="5">
                  <sc-if value="{{ f.w }}" hint-placeholder-val="{{ true }}"><div style="width:21px;height:21px;display:grid;place-items:center;background:var(--color-text,#201e1d);color:var(--color-bg,#f3f2f2);font-size:11px;font-weight:900">W</div></sc-if>
                  <sc-if value="{{ f.l }}" hint-placeholder-val="{{ false }}"><div style="width:21px;height:21px;display:grid;place-items:center;border:1px solid rgba(32,30,29,0.3);box-sizing:border-box;color:rgba(32,30,29,0.4);font-size:11px;font-weight:800">L</div></sc-if>
                  <sc-if value="{{ f.t }}" hint-placeholder-val="{{ false }}"><div style="width:21px;height:21px;display:grid;place-items:center;border:2px solid var(--color-accent,#ec3013);box-sizing:border-box;color:var(--color-accent,#ec3013);font-size:11px;font-weight:800">T</div></sc-if>
                </sc-for>
              </div>
            </div>
          </sc-for>
        </div>
      </sc-if>
      <sc-if value="{{ isRes }}" hint-placeholder-val="{{ false }}">
        <div style="border-top:2px solid var(--color-text,#201e1d)">
          <sc-for list="{{ games }}" as="g" hint-placeholder-count="9">
            <div class="mac" style="display:grid;grid-template-columns:1fr 150px 1fr;align-items:center;height:64px;border-bottom:1px solid rgba(32,30,29,0.14)">
              <sc-if value="{{ g.lw }}" hint-placeholder-val="{{ true }}"><div style="font-size:20px;font-weight:800;white-space:nowrap;overflow:hidden">{{ g.ln }}</div></sc-if>
              <sc-if value="{{ g.rw }}" hint-placeholder-val="{{ false }}"><div style="font-size:20px;font-weight:600;color:rgba(32,30,29,0.5);white-space:nowrap;overflow:hidden">{{ g.ln }}</div></sc-if>
              <div style="display:flex;align-items:center;justify-content:center;gap:10px;font-size:26px;font-weight:900;font-variant-numeric:tabular-nums">
                <div>{{ g.ls }}</div><div style="width:12px;height:2px;background:rgba(32,30,29,0.35)"></div><div>{{ g.rs }}</div>
              </div>
              <sc-if value="{{ g.rw }}" hint-placeholder-val="{{ false }}"><div style="font-size:20px;font-weight:800;text-align:right;white-space:nowrap;overflow:hidden">{{ g.rn }}</div></sc-if>
              <sc-if value="{{ g.lw }}" hint-placeholder-val="{{ true }}"><div style="font-size:20px;font-weight:600;color:rgba(32,30,29,0.5);text-align:right;white-space:nowrap;overflow:hidden">{{ g.rn }}</div></sc-if>
            </div>
          </sc-for>
        </div>
      </sc-if>
      <sc-if value="{{ isLead }}" hint-placeholder-val="{{ false }}">
        <div style="border-top:2px solid var(--color-text,#201e1d)">
          <sc-for list="{{ cats }}" as="c" hint-placeholder-count="11">
            <div class="lid" style="display:grid;grid-template-columns:200px 1fr 300px;align-items:center;height:58px;border-bottom:1px solid rgba(32,30,29,0.14)">
              <div style="font-size:20px;font-weight:900">{{ c.code }}</div>
              <div style="font-size:26px;font-weight:900;font-variant-numeric:tabular-nums">{{ c.val }}</div>
              <div style="font-size:19px;font-weight:700;text-align:right;white-space:nowrap">{{ c.team }}</div>
            </div>
          </sc-for>
        </div>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { list: null, mod: null, sel: 0, tab: 0 };
  componentDidMount() {
    import('./arsiv/haftalar.js?v=' + Date.now()).then(m => { // her açılışta taze liste (önbellek aşımı)
      this.setState({ list: m.HAFTALAR });
      this.loadWeek(m.HAFTALAR, 0);
    });
  }
  loadWeek(list, i) {
    const f = list[i].dosya.replace('./', '');
    Promise.all([import('./arsiv/' + f + '?v=' + Date.now()), import('./tnba-data.js?v=' + Date.now()), import('./tnba-logo-fx.js')]).then(([m, d, fx]) => fx.processTeams(d.TEAMS).then(T => this.setState({ mod: { ...m, TEAMS: T }, sel: i })));
  }
  renderVals() {
    const { list, mod, sel, tab } = this.state;
    const ink = '#201e1d', bgOn = '#201e1d', fgOn = '#f3f2f2';
    const weeks = (list || []).map((w, i) => ({
      label: w.hafta + '. HAFTA',
      num: String(w.hafta),
      pick: () => this.loadWeek(list, i),
      bg: i === sel ? bgOn : 'transparent', fg: i === sel ? fgOn : ink
    }));
    const selLabel = (list && list[sel]) ? list[sel].hafta + '. HAFTA' : '';
    const tabs = ['PUAN DURUMU', 'SONUÇLAR', "EN'LER", 'SIRALAMA SEYRİ ›'].map((t, i) => ({
      label: t, pick: () => { if (i === 3) { window.location.href = 'T-NBA%20Siralama%20Seyri.dc.html'; return; } this.setState({ tab: i }); },
      bg: i === tab ? bgOn : 'transparent', fg: i === tab ? fgOn : ink
    }));
    let rows = [], games = [], cats = [];
    if (mod) {
      const T = mod.TEAMS;
      rows = mod.WEEK.standings.map(a => ({
        r: a.r, n: a.n, m: T[a.n][0], c: T[a.n][1], logo: T[a.n][2], rec: a.rec,
        form: a.form.split('').map(x => ({ w: x === 'W', l: x === 'L', t: x === 'T' }))
      }));
      games = mod.WEEK.matchups.map(g => ({ ln: g[0], ls: g[1], rn: g[2], rs: g[3], lw: g[1] > g[3], rw: g[3] > g[1] }));
      cats = mod.WEEK.leaders.map(c => ({ code: c[0], val: c[2], team: c[3] }));
    }
    return { weeks, selLabel, tabs, rows, games, cats, isStand: tab === 0, isRes: tab === 1, isLead: tab === 2 };
  }
}
</script>
</body>
</html>
